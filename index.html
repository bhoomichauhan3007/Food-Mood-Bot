<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Mood Bot</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        bot: {
                            light: '#a18cd1',
                            dark: '#fbc2eb',
                            accent: '#667eea',
                            text: '#2d3748'
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.15)',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4 overflow-hidden relative font-sans text-gray-800 antialiased">

    <!-- Premium Animated Background -->
    <div class="background-animation"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="glass-overlay"></div>

    <!-- App Wrapper (Holds both screens) -->
    <div id="app-wrapper" class="w-full max-w-md relative h-[650px] z-10 perspective-1000">

        <!-- Welcome Screen -->
        <div id="welcome-screen" class="absolute inset-0 bg-white/10 backdrop-blur-2xl border border-white/30 shadow-glass rounded-[2rem] flex flex-col items-center justify-center p-8 text-center transition-all duration-700 ease-in-out z-50 active-screen">
            <div class="relative mb-8 group">
                <div class="absolute inset-0 bg-gradient-to-tr from-bot-accent to-bot-dark rounded-full animate-spin-slow blur-xl opacity-80 group-hover:opacity-100 transition-opacity"></div>
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=ChefBot&backgroundColor=a18cd1" alt="Bot Avatar" class="w-32 h-32 rounded-full bg-white shadow-2xl relative z-10 p-2 border-4 border-white transform transition-transform duration-500 group-hover:scale-110">
            </div>
            
            <h1 class="text-4xl font-extrabold text-white tracking-wide shadow-black drop-shadow-xl mb-4">Chef MoodBot</h1>
            
            <div class="bg-black/20 backdrop-blur-md rounded-2xl p-4 mb-8 border border-white/10 shadow-inner inline-block">
                <p class="text-gray-100 text-sm font-medium leading-relaxed drop-shadow-md">
                    Welcome! I'm your personal Culinary AI. 🤖👨‍🍳<br><br>
                    Tell me your mood, your cravings, and I will craft the absolute perfect customized dish just for you!
                </p>
            </div>
            
            <button id="start-btn" class="bg-gradient-to-r from-bot-accent to-bot-light hover:from-bot-light hover:to-bot-accent text-white font-bold py-3.5 px-10 rounded-full shadow-[0_0_25px_rgba(102,126,234,0.6)] transform transition-all duration-300 hover:-translate-y-1.5 hover:scale-105 active:scale-95 flex items-center gap-3 border border-white/30">
                Let's Cook <i class="fa-solid fa-fire text-orange-300"></i>
            </button>
        </div>

        <!-- Main Chat Container -->
        <div id="chat-container" class="absolute inset-0 w-full bg-white/20 backdrop-blur-2xl border border-white/40 shadow-glass rounded-[2rem] overflow-hidden flex flex-col h-[650px] transition-all duration-700 ease-in-out hidden-screen pointer-events-none">
        
        <!-- Header -->
        <header class="bg-white/30 backdrop-blur-xl p-5 flex items-center justify-between border-b border-white/30 sticky top-0 z-20">
            <div class="flex items-center gap-4">
                <div class="bot-avatar-container relative">
                    <div class="absolute inset-0 bg-gradient-to-tr from-bot-accent to-bot-dark rounded-full animate-spin-slow blur-sm opacity-70"></div>
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=ChefBot&backgroundColor=a18cd1" alt="Bot Avatar" class="w-14 h-14 rounded-full bg-white shadow-xl relative z-10 p-1 border-2 border-white/80 bot-hover-effect">
                    <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-400 border-2 border-white rounded-full z-20"></span>
                </div>
                <div>
                    <h1 class="font-extrabold text-xl text-white tracking-wide shadow-black drop-shadow-md">Chef MoodBot</h1>
                    <p class="text-xs text-green-300 font-semibold flex items-center gap-1 drop-shadow-sm">
                        <i class="fa-solid fa-fire text-[10px] animate-pulse text-orange-400"></i> Cooking up suggestions!
                    </p>
                </div>
            </div>
            <button class="text-white hover:text-bot-dark transition-colors w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20">
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>
        </header>

        <!-- Chat Area -->
        <main id="chat-box" class="flex-1 overflow-y-auto p-5 pb-2 smooth-scroll flex flex-col gap-4">
            <!-- Initial messages will be dynamically injected via JS -->
        </main>

        <!-- Dynamic Quick Replies Area -->
        <div id="quick-replies" class="px-5 py-3 flex flex-wrap gap-2 justify-center min-h-[50px] transition-all duration-300">
            <!-- Buttons injected via JS -->
        </div>

        <!-- Input Area -->
        <footer class="bg-white/20 backdrop-blur-xl p-4 border-t border-white/30">
            <form id="chat-form" class="flex items-center gap-3 bg-white/80 backdrop-blur-md rounded-full p-1.5 pl-5 shadow-inner border border-white/50 focus-within:ring-2 focus-within:ring-bot-light transition-all">
                <input type="text" id="user-input" placeholder="Type your answer here..." required class="flex-1 bg-transparent border-none outline-none text-sm text-gray-800 placeholder-gray-500 font-medium py-2">
                <button type="submit" class="bg-gradient-to-r from-bot-accent to-bot-light hover:opacity-90 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg transform transition-all hover:scale-110 active:scale-95">
                    <i class="fa-solid fa-paper-plane text-sm translate-x-[-1px] translate-y-[1px]"></i>
                </button>
            </form>
        </footer>

    </div>

    <!-- Custom Scripts -->
    <script src="script.js"></script>
</body>
</html>
